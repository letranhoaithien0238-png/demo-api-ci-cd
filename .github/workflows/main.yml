
name: Restful-Booker CI Pipeline

on: [push, pull_request]

jobs:
  api-testing:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Lấy mã nguồn từ GitHub
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      # Bước 2: Cài đặt Node.js
      - name: 2. Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Bước 3: Cài đặt Newman
      - name: 3. Cài đặt công cụ Newman
        run: npm install -g newman

      # Bước 4: Chạy kiểm thử API tự động
      - name: 4. Chạy bộ Test tự động
        run: |
          newman run RestfulBooker.postman_collection.json \
            -e RestfulBooker.postman_environment.json
